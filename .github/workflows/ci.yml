name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile + boot smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'        # matches Dockerfile (python:3.11-slim-bookworm)
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources (syntax gate)
        run: python -m compileall -q main.py tools endpoints

      - name: Boot smoke (autoload must bring tools up)
        env:
          JWT_SECRET: ci-smoke-secret
        run: |
          python - <<'PY'
          import main
          loaded = main.app.state.tools_loaded
          failed = main.app.state.tools_failed
          print(f"tools_loaded={loaded}  tools_failed={len(failed)}  routes={len(main.app.routes)}")
          for f in failed:
              # Quarantined tools are tolerated by design (one bad tool can't
              # crash boot) and some need external binaries CI lacks (sqlmap,
              # nikto, ...). Surface them, but don't fail the build on them.
              print("  quarantined:", f)
          assert loaded > 0, "no tools loaded — boot is broken"
          PY

      - name: Tests (pytest — gating)
        env:
          JWT_SECRET: ci-smoke-secret
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'            # matches preflight.sh (node:18-alpine)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        env:
          # CRA's react-scripts build treats ESLint warnings as errors when
          # CI is truthy (GitHub Actions sets CI=true). Keep the first CI green
          # by gating on real build errors only; flip to "true" once the
          # existing warnings are cleaned up to enforce a zero-warning build.
          CI: false
        run: npm run build

  security:
    name: Security (secrets + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Blocks the build if a secret is present in the working tree — the class
      # of leak that put VPS/admin creds in git history. Scans files (--no-git),
      # not history, so the historical-leak cleanup is handled separately and
      # does not permanently wedge CI.
      - name: gitleaks — secret scan
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --redact -v --exit-code 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GATING: fails the build on any dependency CVE except the explicitly
      # tracked exceptions in docs/SECURITY-DEBT.md (Starlette CVEs that require
      # a coordinated FastAPI major upgrade). pip+wheel are upgraded first so
      # build-tooling advisories (not shipped to prod) don't wedge the gate.
      - name: pip-audit — dependency CVEs (gating)
        run: |
          python -m pip install --quiet --upgrade pip wheel
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818

      # Report-only BY DESIGN: this is a pentest platform, so its scanner tools
      # legitimately make outbound requests and run external binaries — the
      # generic SSRF/command-exec rules fire on intended behaviour. Hard-gating
      # generic rules here means false positives, not real bugs. Kept visible
      # for triage; gate a curated ruleset on endpoints/ + main.py separately
      # when the rule set is tuned (tracked in docs/SECURITY-DEBT.md).
      - name: semgrep — SAST (report-only)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config auto --quiet tools endpoints main.py || true
