name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vluser
          POSTGRES_PASSWORD: vlpass
          POSTGRES_DB: vulnuslab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vluser -d vulnuslab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      DATABASE_URL: postgresql+psycopg2://vluser:vlpass@localhost:5432/vulnuslab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run database migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest

  forge-score:
    name: VL-FOUNDRY forge score gate
    runs-on: ubuntu-latest
    # No DB/JWT needed: the scorer only imports orchestrators (for L4 wiring)
    # and inspects source via AST — it never connects to Postgres or auth.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # Backend deps are required so `endpoints.<module>_orchestrator` import
        # cleanly (the L4 coverage check imports each orchestrator).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gate forge scores against committed baselines
        # Fails the build if any module regresses >2 pts below its recorded
        # score in .vl-foundry-scores.json, or falls below the 85 ship floor.
        run: python scripts/ci_score_gate.py

  backend-syntax:
    name: Backend syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all backend modules
        run: python -m compileall -q main.py tools endpoints

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # CI=false so pre-existing eslint warnings don't fail the build
        # (Create React App treats warnings as errors when CI=true).
        run: CI=false npm run build

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a push to main re-scans every commit; on PRs the
          # action scans just the PR's commits.
          fetch-depth: 0
      - name: Scan for committed secrets
        # Fails the build on any real secret (cloud key, private key, token,
        # DB dump, .env). Scanner payloads / detection patterns are allowlisted
        # in .gitleaks.toml. Pinned to a tag so a fresh image can't change the
        # gate's behaviour under us. Free for this personal repo (the license
        # env var is only required for GitHub *Organizations*).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
