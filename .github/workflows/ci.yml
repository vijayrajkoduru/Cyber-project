name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          set +e
          python -m pytest -rA --tb=long -p no:cacheprovider > pytest-out.txt 2>&1
          code=$?
          echo "===== PYTEST OUTPUT ====="
          cat pytest-out.txt
          if [ $code -ne 0 ]; then
            # Surface the failing tail as an annotation (readable via the API)
            msg=$(tail -50 pytest-out.txt | tr '\n' '~' | tr -d '\r' | cut -c1-1900)
            echo "::error title=pytest failed (code $code)::$msg"
          fi
          exit $code

  backend-syntax:
    name: Backend syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all backend modules
        run: python -m compileall -q main.py tools endpoints

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # CI=false so pre-existing eslint warnings don't fail the build
        # (Create React App treats warnings as errors when CI=true).
        run: CI=false npm run build
