name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vluser
          POSTGRES_PASSWORD: vlpass
          POSTGRES_DB: vulnuslab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vluser -d vulnuslab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      DATABASE_URL: postgresql+psycopg2://vluser:vlpass@localhost:5432/vulnuslab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run database migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest

  forge-score:
    name: VL-FOUNDRY forge score gate
    runs-on: ubuntu-latest
    # No DB/JWT needed: the scorer only imports orchestrators (for L4 wiring)
    # and inspects source via AST — it never connects to Postgres or auth.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # Backend deps are required so `endpoints.<module>_orchestrator` import
        # cleanly (the L4 coverage check imports each orchestrator).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gate forge scores against committed baselines
        # Fails the build if any module regresses >2 pts below its recorded
        # score in .vl-foundry-scores.json, or falls below the 85 ship floor.
        run: python scripts/ci_score_gate.py

  dep-audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit production dependencies
        # Gates on production requirements.txt (the deployed surface; the
        # dev/test deps in requirements-dev.txt are not shipped in the image).
        # The ignored CVEs cannot be fixed without a major upgrade we haven't
        # validated yet, so they're tracked, not silently dropped:
        #   starlette 0.47.x — needs the FastAPI 1.x / starlette 1.x migration:
        #     PYSEC-2026-161, PYSEC-2026-248, PYSEC-2026-249,
        #     CVE-2025-62727, CVE-2026-48817, CVE-2026-48818
        #   pyasn1 0.4.8 — held <0.5 by python-jose 3.4.0: CVE-2026-30922
        # Re-review this list on every dependency bump; a NEW CVE fails the build.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818 \
            --ignore-vuln CVE-2026-30922

  backend-syntax:
    name: Backend syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all backend modules
        run: python -m compileall -q main.py tools endpoints

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # CI=false so pre-existing eslint warnings don't fail the build
        # (Create React App treats warnings as errors when CI=true).
        run: CI=false npm run build
