<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="50%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#1e90ff"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00bfff"/>
      <stop offset="60%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbitglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <ellipse cx="200" cy="200" rx="170" ry="170" fill="none" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.15" filter="url(#glow)"/>

  <!-- Shield shape -->
  <path d="M200 30 L330 80 L330 200 C330 270 275 320 200 355 C125 320 70 270 70 200 L70 80 Z"
    fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#softglow)"/>

  <!-- Shield inner highlight -->
  <path d="M200 52 L314 98 L314 200 C314 260 262 305 200 336 C138 305 86 260 86 200 L86 98 Z"
    fill="none" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Circuit lines top-left -->
  <line x1="110" y1="130" x2="140" y2="130" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="140" y1="130" x2="140" y2="155" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="110" cy="130" r="3" fill="#1e90ff" opacity="0.8"/>
  <circle cx="140" cy="155" r="2" fill="#00bfff" opacity="0.7"/>

  <line x1="110" y1="160" x2="135" y2="160" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="110" cy="160" r="3" fill="#1e90ff" opacity="0.6"/>

  <line x1="120" y1="185" x2="148" y2="185" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="120" cy="185" r="2" fill="#1e90ff" opacity="0.6"/>

  <!-- Circuit lines top-right -->
  <line x1="290" y1="130" x2="260" y2="130" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="260" y1="130" x2="260" y2="155" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="290" cy="130" r="3" fill="#1e90ff" opacity="0.8"/>
  <circle cx="260" cy="155" r="2" fill="#00bfff" opacity="0.7"/>

  <line x1="290" y1="160" x2="265" y2="160" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="290" cy="160" r="3" fill="#1e90ff" opacity="0.6"/>

  <line x1="280" y1="185" x2="252" y2="185" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="280" cy="185" r="2" fill="#1e90ff" opacity="0.6"/>

  <!-- Circuit lines bottom -->
  <line x1="130" y1="265" x2="155" y2="265" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="130" cy="265" r="2" fill="#1e90ff" opacity="0.5"/>
  <line x1="270" y1="265" x2="245" y2="265" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="270" cy="265" r="2" fill="#1e90ff" opacity="0.5"/>

  <!-- Lock shackle -->
  <path d="M162 192 L162 168 C162 138 238 138 238 168 L238 192"
    stroke="url(#lockGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#softglow)"/>

  <!-- Lock body -->
  <rect x="148" y="192" width="104" height="88" rx="12"
    fill="#0a1628" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Lock body inner -->
  <rect x="154" y="198" width="92" height="76" rx="9"
    fill="rgba(30,144,255,0.08)"/>

  <!-- Keyhole -->
  <circle cx="200" cy="232" r="14" fill="url(#lockGrad)" filter="url(#softglow)"/>
  <rect x="195" y="244" width="10" height="18" rx="4" fill="url(#lockGrad)"/>

  <!-- Keyhole hole -->
  <circle cx="200" cy="232" r="6" fill="#0a1628"/>

  <!-- Orbit ring -->
  <ellipse cx="200" cy="200" rx="165" ry="55" fill="none"
    stroke="url(#orbitGrad)" stroke-width="3"
    transform="rotate(-20 200 200)"
    filter="url(#orbitglow)"
    stroke-opacity="0.85"/>

  <!-- Orbit glow dots -->
  <circle cx="48" cy="175" r="5" fill="#00bfff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="352" cy="225" r="5" fill="#1e90ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Top glow point -->
  <circle cx="200" cy="30" r="4" fill="#00bfff" filter="url(#glow)" opacity="0.8"/>
</svg>
