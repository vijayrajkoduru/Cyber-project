<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a3a52"/>
      <stop offset="100%" stop-color="#1a2233"/>
    </radialGradient>
    <radialGradient id="bgOuter" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e3050" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="40%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <linearGradient id="shieldShine" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6ad4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lockBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="40%" stop-color="#a0b8cc"/>
      <stop offset="100%" stop-color="#6888a0"/>
    </linearGradient>
    <linearGradient id="lockShackle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0e0ef"/>
      <stop offset="100%" stop-color="#8098b0"/>
    </linearGradient>
    <linearGradient id="orbitLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ccff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4dd8ff"/>
      <stop offset="70%" stop-color="#00aaff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbitGlow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M256 62 L390 115 L390 256 C390 336 330 395 256 428 C182 395 122 336 122 256 L122 115 Z"/>
    </clipPath>
  </defs>

  <!-- Dark grey background -->
  <rect width="512" height="512" fill="#1e2836"/>
  <!-- Radial glow center -->
  <ellipse cx="256" cy="240" rx="200" ry="200" fill="url(#bgOuter)"/>

  <!-- Shield outer glow -->
  <path d="M256 62 L390 115 L390 256 C390 336 330 395 256 428 C182 395 122 336 122 256 L122 115 Z"
    fill="none" stroke="#1e90ff" stroke-width="18" stroke-opacity="0.25" filter="url(#shieldGlow)"/>

  <!-- Shield body -->
  <path d="M256 62 L390 115 L390 256 C390 336 330 395 256 428 C182 395 122 336 122 256 L122 115 Z"
    fill="url(#shieldFill)"/>

  <!-- Shield border -->
  <path d="M256 62 L390 115 L390 256 C390 336 330 395 256 428 C182 395 122 336 122 256 L122 115 Z"
    fill="none" stroke="url(#shieldBorder)" stroke-width="5" filter="url(#glow)"/>

  <!-- Shield left shine (bright left edge) -->
  <path d="M256 62 L390 115 L390 256 C390 336 330 395 256 428 C182 395 122 336 122 256 L122 115 Z"
    fill="url(#shieldShine)" clip-path="url(#shieldClip)"/>

  <!-- Circuit lines (left side of shield) -->
  <g stroke="#1e90ff" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- Main trunk -->
    <line x1="155" y1="200" x2="220" y2="200"/>
    <line x1="220" y1="200" x2="220" y2="165"/>
    <line x1="220" y1="165" x2="245" y2="165"/>
    <!-- Branch 1 -->
    <line x1="155" y1="230" x2="195" y2="230"/>
    <line x1="195" y1="230" x2="195" y2="260"/>
    <!-- Branch 2 -->
    <line x1="165" y1="270" x2="210" y2="270"/>
    <line x1="210" y1="270" x2="210" y2="290"/>
    <!-- Branch 3 -->
    <line x1="145" y1="310" x2="185" y2="310"/>
    <line x1="185" y1="310" x2="185" y2="330"/>
    <line x1="185" y1="330" x2="215" y2="330"/>
    <!-- Small branches -->
    <line x1="175" y1="200" x2="175" y2="185"/>
    <line x1="175" y1="185" x2="160" y2="185"/>
  </g>
  <!-- Circuit dots -->
  <g fill="#00bfff" opacity="0.85">
    <circle cx="155" cy="200" r="4"/>
    <circle cx="220" cy="165" r="3"/>
    <circle cx="245" cy="165" r="3"/>
    <circle cx="155" cy="230" r="4"/>
    <circle cx="195" cy="260" r="3"/>
    <circle cx="165" cy="270" r="3"/>
    <circle cx="210" cy="290" r="3"/>
    <circle cx="145" cy="310" r="4"/>
    <circle cx="215" cy="330" r="3"/>
    <circle cx="160" cy="185" r="3"/>
  </g>

  <!-- Orbit ring (tilted ellipse around shield) -->
  <ellipse cx="256" cy="256" rx="210" ry="70"
    fill="none" stroke="url(#orbitLine)" stroke-width="4"
    transform="rotate(-18 256 256)"
    filter="url(#orbitGlow)"/>

  <!-- Orbit glow dots -->
  <circle cx="65" cy="222" r="7" fill="#00ccff" filter="url(#glow)" opacity="0.95"/>
  <circle cx="447" cy="290" r="7" fill="#1e90ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Lock shackle -->
  <path d="M205 248 L205 218 C205 183 307 183 307 218 L307 248"
    stroke="url(#lockShackle)" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#lockGlow)"/>
  <!-- Shackle dark interior -->
  <path d="M205 248 L205 218 C205 183 307 183 307 218 L307 248"
    stroke="#1a2a3a" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Lock body -->
  <rect x="185" y="245" width="142" height="118" rx="14" fill="url(#lockBody)" filter="url(#lockGlow)"/>
  <!-- Lock body highlight top -->
  <rect x="185" y="245" width="142" height="30" rx="14" fill="#d8eaf8" opacity="0.4"/>
  <!-- Lock body shadow bottom -->
  <rect x="185" y="313" width="142" height="50" rx="14" fill="#3a5070" opacity="0.3"/>
  <!-- Lock body center seam -->
  <line x1="256" y1="248" x2="256" y2="360" stroke="#4a6888" stroke-width="1.5" opacity="0.5"/>

  <!-- Keyhole circle -->
  <circle cx="256" cy="295" r="20" fill="#1a2a3c" stroke="#8098b0" stroke-width="2"/>
  <!-- Keyhole shape -->
  <circle cx="256" cy="290" r="9" fill="#0d1520"/>
  <path d="M249 298 L263 298 L260 318 L252 318 Z" fill="#0d1520"/>

  <!-- Top inner shield highlight line -->
  <path d="M256 72 L378 122 L378 256 C378 330 322 385 256 416"
    fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-opacity="0.2"/>
</svg>
