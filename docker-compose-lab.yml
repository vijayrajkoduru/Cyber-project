version: "3.8"

# OSCP Dashboard — Vulnerable Lab
# Run: docker compose -f docker-compose-lab.yml up -d
# All targets accessible from Kali at localhost:PORT

services:

  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    ports:
      - "8001:80"
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat
    container_name: lab_webgoat
    ports:
      - "8002:8080"
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop
    container_name: lab_juiceshop
    ports:
      - "8003:3000"
    restart: unless-stopped

  mutillidae:
    image: webpwnized/mutillidae
    container_name: lab_mutillidae
    ports:
      - "8004:80"
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp
    container_name: lab_bwapp
    ports:
      - "8005:80"
    restart: unless-stopped

  hackazon:
    image: ianwijaya/hackazon
    container_name: lab_hackazon
    ports:
      - "8006:80"
    restart: unless-stopped

  nodegoat:
    image: owasp/nodegoat
    container_name: lab_nodegoat
    ports:
      - "8007:4000"
    restart: unless-stopped
