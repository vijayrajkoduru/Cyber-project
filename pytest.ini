[pytest]
testpaths = tests
# Put the repo root on sys.path so `import main` / `import tools...` resolve
# regardless of how pytest is launched (bare `pytest` vs `python -m pytest`).
# Without this, the bare `pytest` console script omits the repo root and the
# full-boot tests fail at collection (exit code 2).
pythonpath = .
addopts = -q
# datetime.utcnow() is used throughout the codebase; silence its 3.12 deprecation
filterwarnings =
    ignore::DeprecationWarning
