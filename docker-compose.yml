services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnuslab_backend
    ports:
    - 8000:8000
    env_file:
    - .env
    environment:
    - WORKERS=4
    volumes:
    - scan_data:/app/data
    - ./data:/data
    - /root/backups:/backups
    - ./users.db:/app/data/users.db
    - ./last_known_good:/app/.last_known_good
    - ./tools/_payloads:/app/tools/_payloads:ro
    # ── Host project mounted read-only so /api/admin/backups can tar
    #    real host files (main.py, src/, docker-compose.yml, etc.).
    #    Without this the backup endpoint sees /app (container fs) not the host repo.
    - ./:/host-project:ro
    networks:
    - vulnuslab
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 768m
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)" || exit
        1
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 120s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vulnuslab_frontend
    ports:
    - 80:80
    - 443:443
    depends_on:
      backend:
        condition: service_healthy
    networks:
    - vulnuslab
    restart: unless-stopped
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./extra_nginx_conf:/etc/nginx/extra_nginx_conf:ro

  # ══════════════════════════════════════════════════════════════════════
  # VULNERABLE LAB / TEST TARGETS — NOT part of the production app.
  # Every lab below is gated behind the "labs" profile so a bare
  #   docker compose up -d         -> starts ONLY backend + frontend
  # Bring the labs up ON DEMAND (dev / testing / demos), same network so
  # the backend can scan them by name:
  #   docker compose --profile labs up -d            (all labs)
  #   docker compose --profile labs up -d lab_dvwa   (one lab)
  #   docker compose --profile labs down             (stop them)
  # (They are also defined standalone in docker-compose.targets.yml.)
  # ══════════════════════════════════════════════════════════════════════
  lab_dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    profiles:
    - labs
    networks:
    - vulnuslab
  lab_juiceshop:
    image: bkimminich/juice-shop
    container_name: lab_juiceshop
    profiles:
    - labs
    networks:
    - vulnuslab
  lab_bwapp:
    image: raesene/bwapp
    container_name: lab_bwapp
    profiles:
    - labs
    networks:
    - vulnuslab
  lab_mutillidae:
    image: citizenstig/nowasp
    container_name: lab_mutillidae
    profiles:
    - labs
    networks:
    - vulnuslab
  lab_webgoat:
    image: webgoat/webgoat
    container_name: lab_webgoat
    profiles:
    - labs
    networks:
    - vulnuslab
  lab_metasploitable:
    image: tleemcjr/metasploitable2
    container_name: lab_metasploitable
    profiles:
    - labs
    networks:
    - vulnuslab

  # ── VL-METHOD Password Range ─────────────────────────────────────────
  # Three deterministic targets that exercise all 7 stages of every
  # Password Attacks scanner. All use admin/admin so quick_probe HITS
  # (which gates deep_scan + verify + privilege + chain_handoff).
  # See labs/vl_password_range/README.md for per-scanner invocations.
  # ─────────────────────────────────────────────────────────────────────
  lab_pwd_ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: lab_pwd_ssh
    profiles:
    - labs
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PASSWORD_ACCESS=true
    - USER_NAME=admin
    - USER_PASSWORD=admin
    - SUDO_ACCESS=true
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_pwd_smb:
    image: dperson/samba:latest
    container_name: lab_pwd_smb
    profiles:
    - labs
    command: >-
      -u "admin;admin"
      -s "public;/share;yes;no;yes;all"
      -p
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_pwd_web:
    build:
      context: ./labs/vl_password_range/webform
      dockerfile: Dockerfile
    container_name: lab_pwd_web
    profiles:
    - labs
    networks:
    - vulnuslab
    restart: unless-stopped

  # ── Database / Service Range ─────────────────────────────────────────
  # Real DB + service targets for the Password (brute), Network (port/
  # service scan) and Vuln (version/CVE + exposure) modules. Creds match
  # each brute scanner's quick_probe defaults so a scan HITS immediately.
  # Internal only (no published ports) — reachable from the backend over
  # the vulnuslab network, exactly like the web labs.
  #   lab_mysql     root/root            (3306)  mysql_brute
  #   lab_postgres  postgres/postgres    (5432)  postgres_brute
  #   lab_ftp       admin/admin          (21)    ftp_brute
  #   lab_redis     (no auth, exposed)   (6379)  network/vuln
  #   lab_mongo     (no auth, exposed)   (27017) network/vuln
  # Bring them up:
  #   docker compose --profile labs up -d lab_mysql lab_postgres lab_ftp lab_redis lab_mongo
  # ─────────────────────────────────────────────────────────────────────
  lab_mysql:
    image: mysql:5.7
    container_name: lab_mysql
    profiles:
    - labs
    environment:
    - MYSQL_ROOT_PASSWORD=root
    - MYSQL_DATABASE=appdb
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_postgres:
    image: postgres:15-alpine
    container_name: lab_postgres
    profiles:
    - labs
    environment:
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=appdb
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: lab_ftp
    profiles:
    - labs
    environment:
    - USERS=admin|admin
    - ADDRESS=lab_ftp
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_redis:
    image: redis:7-alpine
    container_name: lab_redis
    profiles:
    - labs
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_mongo:
    image: mongo:6
    container_name: lab_mongo
    profiles:
    - labs
    networks:
    - vulnuslab
    restart: unless-stopped

  # Optional RDP target — uncomment to enable Ncrack full-stage testing.
  # Image is ~600MB so it's off by default. Default creds: admin/admin.
  # lab_pwd_rdp:
  #   image: danielguerra/ubuntu-xrdp:latest
  #   container_name: lab_pwd_rdp
  #   environment:
  #   - TZ=Etc/UTC
  #   networks:
  #   - vulnuslab
  #   restart: unless-stopped

  # ── Phase C / D / E Password Attacks Labs ────────────────────────────
  # AD (Phase C) and OAuth/SAML (Phase D). Together ~2.5 GB of images;
  # lab_pwd_ad needs ~90s to provision its Samba AD domain.
  # Enable on demand:
  #   docker compose --profile labs up -d lab_pwd_ad lab_pwd_oauth lab_pwd_saml
  #   docker compose --profile labs exec lab_pwd_ad bash /bootstrap.sh
  # See labs/vl_password_range/PHASE_CDE_LABS.md for walkthroughs.
  # ─────────────────────────────────────────────────────────────────────

  # lab_pwd_ad — Samba Active Directory Domain Controller
  # Targets: kerberoast_audit, asreproast_audit, dcsync_audit,
  #          bloodhound_audit, ldap_brute (against AD)
  # Image ~1.5GB, boot ~90s. Hostname dc01.vlrange.local is resolvable
  # inside the vulnuslab bridge.
  lab_pwd_ad:
    image: nowsci/samba-domain:latest
    container_name: lab_pwd_ad
    profiles:
    - labs
    hostname: dc01.vlrange.local
    environment:
    - DOMAIN=VLRANGE
    - DOMAIN_DC=dc=vlrange,dc=local
    - DOMAIN_EMAIL=vlrange.local
    - DOMAINPASS=VLrange_Admin_2026!
    - DNSFORWARDER=1.1.1.1
    - HOSTIP=
    - INSECURELDAP=true
    - NOCOMPLEXITY=true
    networks:
    - vulnuslab
    extra_hosts:
    - "dc01.vlrange.local:127.0.0.1"
    volumes:
    - lab_pwd_ad_data:/var/lib/samba
    - lab_pwd_ad_conf:/etc/samba/external
    - ./labs/vl_password_range/ad_bootstrap.sh:/bootstrap.sh:ro
    cap_add:
    - SYS_ADMIN
    restart: unless-stopped
  #   # Seeded users (run /bootstrap.sh once after first boot):
  #   #   Administrator / VLrange_Admin_2026!   (Domain Admin)
  #   #   svc_mssql     / Password123           (kerberoastable - MSSQLSvc SPN)
  #   #   svc_http      / Spring2024            (kerberoastable - HTTP SPN)
  #   #   jbloggs       / NoPreAuth!            (AS-REP roastable)
  #   #   regularuser   / regularuser           (standard domain user)

  # lab_pwd_oauth — Keycloak OAuth/OIDC IdP
  # Targets: oauth_token_audit
  # Image ~600MB. Realm vl-test-realm is auto-imported on first boot.
  lab_pwd_oauth:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: lab_pwd_oauth
    profiles:
    - labs
    command: ["start-dev", "--import-realm"]
    environment:
    - KEYCLOAK_ADMIN=admin
    - KEYCLOAK_ADMIN_PASSWORD=admin_VLrange_2026
    - KC_HTTP_ENABLED=true
    - KC_HOSTNAME_STRICT=false
    - KC_HOSTNAME_STRICT_HTTPS=false
    networks:
    - vulnuslab
    volumes:
    - ./labs/vl_password_range/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped
  #   # Test users (in vl-test-realm):
  #   #   alice / Password1!
  #   #   bob   / Password2!
  #   # Client: vl-test-client (public, implicit flow ON, PKCE NOT enforced)

  # lab_pwd_saml — SimpleSAMLphp IdP + SP for SAML attack testing
  # Targets: saml_signature_audit
  # Image ~400MB. Provides both IdP and SP endpoints on port 8080.
  lab_pwd_saml:
    image: kristophjunge/test-saml-idp:latest
    container_name: lab_pwd_saml
    profiles:
    - labs
    environment:
    - SIMPLESAMLPHP_SP_ENTITY_ID=lab-saml-sp
    - SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE=http://lab_pwd_saml:8080/simplesaml/module.php/saml/sp/saml2-acs.php/default-sp
    - SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE=http://lab_pwd_saml:8080/simplesaml/module.php/saml/sp/saml2-logout.php/default-sp
    - SIMPLESAMLPHP_IDP_ENTITY_ID=http://lab_pwd_saml:8080/simplesaml/saml2/idp/metadata.php
    networks:
    - vulnuslab
    restart: unless-stopped
  #   # Test users (image defaults):
  #   #   user1 / user1pass
  #   #   user2 / user2pass

  # ── ICS / IoT Range ──────────────────────────────────────────────────
  # Conpot — the Honeynet Project's ICS/SCADA honeypot. The "default"
  # template emulates a Siemens S7-200 (MODBUS 502, s7comm 102, SNMP 161,
  # HTTP 80). Used by the IoT/OT module + vuln tier15. Internal only.
  lab_modbus:
    image: honeynet/conpot:latest
    container_name: lab_modbus
    profiles:
    - labs
    entrypoint: ["conpot"]
    command: ["-f", "--template", "default"]
    networks:
    - vulnuslab
    restart: unless-stopped

  # ── Kubernetes Range ─────────────────────────────────────────────────
  # Single-node k3s for the Container/Kubernetes module + vuln tier9/tier10
  # live-cluster tiers. Writes a kubeconfig to ./labs/vl_k8s_range/; rewrite
  # its server URL to https://lab_k3s:6443 (see labs/vl_k8s_range/README.md).
  lab_k3s:
    image: rancher/k3s:v1.29.6-k3s2
    container_name: lab_k3s
    profiles:
    - labs
    command: server --tls-san lab_k3s --write-kubeconfig-mode 644 --write-kubeconfig /output/kubeconfig.yaml
    privileged: true
    networks:
    - vulnuslab
    volumes:
    - ./labs/vl_k8s_range:/output
    - lab_k3s_data:/var/lib/rancher/k3s
    tmpfs:
    - /run
    - /var/run
    restart: unless-stopped

volumes:
  scan_data: null
  lab_pwd_ad_data: null
  lab_pwd_ad_conf: null
  lab_k3s_data: null
networks:
  vulnuslab:
    driver: bridge
