# OSCP Dashboard — Full Stack
# Customer runs: docker compose up -d
# Then open: http://localhost

services:

  # ── Backend: Kali Linux + all scanning tools + FastAPI ─────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oscp_backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true          # needed for nmap, tcpdump, masscan raw sockets
    ports:
      - "8000:8000"
      # Reverse-shell handler ports — bound to c2.vulnuslab.com (DNS-only A record,
      # NOT Cloudflare proxied) so external targets can connect back to msfconsole
      # listeners running inside this container.
      - "4444-4500:4444-4500/tcp"
    env_file:
      - .env                  # optional: SHODAN_KEY, VIRUSTOTAL_KEY, etc.
    volumes:
      - scan_data:/app/data   # persist scan results + user DB
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - oscp_net

  # ── Frontend: React dashboard served by nginx ──────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: oscp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - oscp_net

  # ── Vulnerable Lab Targets (built-in, no external VM needed) ───
  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    ports:
      - "8001:80"
    restart: unless-stopped
    networks:
      - oscp_net

  webgoat:
    image: webgoat/webgoat:latest
    container_name: lab_webgoat
    ports:
      - "8002:8080"
    restart: unless-stopped
    networks:
      - oscp_net

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: lab_juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - oscp_net

  mutillidae:
    image: citizenstig/nowasp
    container_name: lab_mutillidae
    ports:
      - "8003:80"
    restart: unless-stopped
    networks:
      - oscp_net

  bwapp:
    image: raesene/bwapp
    container_name: lab_bwapp
    ports:
      - "8004:80"
    restart: unless-stopped
    networks:
      - oscp_net

  # Metasploitable 2 — Rapid7's classic vulnerable VM packaged for Docker.
  # Includes ~25 intentionally vulnerable services on a single container:
  # vsftpd 2.3.4 backdoor (21), Samba 3.x (445), distccd (3632), UnrealIRCd
  # backdoor (6667), Tomcat default creds (8180), and many more. Ports are
  # NOT exposed externally — the backend container reaches it over the
  # internal oscp_net bridge by hostname, which is faster and avoids host
  # port conflicts (we already use 80/8000/8001-8004/3000/6200).
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: lab_metasploitable
    restart: unless-stopped
    # Keep the container alive after the startup script finishes — the upstream
    # image runs `/bin/services.sh && bash`, and without an allocated TTY the
    # interactive bash exits immediately, sending the container into a crash
    # loop even though every service (FTP, Samba, IRC, Tomcat, vsftpd, etc.)
    # is actually running fine. tty+stdin keeps bash open as PID 1.
    tty: true
    stdin_open: true
    networks:
      - oscp_net

networks:
  oscp_net:
    driver: bridge

volumes:
  scan_data:
