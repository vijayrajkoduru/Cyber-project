services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnuslab_backend
    # Bind to loopback only — nginx reaches the backend over the compose network
    # as "backend:8000". Publishing 0.0.0.0:8000 bypassed nginx TLS + login throttle.
    ports:
    - 127.0.0.1:8000:8000
    env_file:
    - .env
    environment:
    - WORKERS=4
    # Session cookie Secure flag follows the client scheme (https via edge => Secure).
    - VL_COOKIE_SECURE=auto
    - DATABASE_URL=postgresql+psycopg2://vluser:${POSTGRES_PASSWORD:-vlpass}@postgres:5432/vulnuslab
    # nmap only uses its file capabilities (setcap in the Dockerfile) when
    # told it is privileged; the image runs as non-root uid 10001 (vulnus).
    - NMAP_PRIVILEGED=1
    # Raw-socket scanners (nmap -sS/-O, masscan, hping3, naabu, ping) carry
    # file capabilities instead of running the API as root. A file cap outside
    # the container's bounding set makes exec fail (EPERM), so both caps must
    # be granted here. NOTE: `security_opt: [no-new-privileges:true]` is
    # deliberately NOT set — it makes the kernel ignore file capabilities on
    # exec, which would break every raw-socket scan for the non-root user.
    cap_add:
    - NET_RAW
    - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
    # Every writable mount below must be owned by uid/gid 10001 on the host
    # (the image's `vulnus` user) — see the Dockerfile NONROOT-V1 block.
    volumes:
    - scan_data:/app/data
    - ./data:/data
    - /root/backups:/backups
    - ./last_known_good:/app/.last_known_good:ro
    - ./tools/_payloads:/app/tools/_payloads:ro
    # ── Narrow read-only mounts for /api/admin/backups (tools/admin/backups.py
    #    tars INCLUDE_PATHS from /host-project). Only those paths are mounted —
    #    never the whole repo: `./:/host-project` exposed .env (live payment /
    #    LLM / mail keys), .git history and everything else to the API process.
    #    Secrets reach the container ONLY via env_file/environment above.
    #    Keep this list in sync with INCLUDE_PATHS (missing paths are skipped).
    #    Single-file binds pin the inode: after editing one of these files on
    #    the host with an editor that replaces the file, recreate the backend.
    - ./data:/host-project/data:ro
    - ./main.py:/host-project/main.py:ro
    - ./tools:/host-project/tools:ro
    - ./endpoints:/host-project/endpoints:ro
    - ./profiles:/host-project/profiles:ro
    - ./requirements.txt:/host-project/requirements.txt:ro
    - ./src:/host-project/src:ro
    - ./public:/host-project/public:ro
    - ./package.json:/host-project/package.json:ro
    - ./package-lock.json:/host-project/package-lock.json:ro
    - ./docker-compose.yml:/host-project/docker-compose.yml:ro
    - ./Dockerfile:/host-project/Dockerfile:ro
    - ./Dockerfile.frontend:/host-project/Dockerfile.frontend:ro
    - ./nginx.conf:/host-project/nginx.conf:ro
    - ./.gitignore:/host-project/.gitignore:ro
    - ./.dockerignore:/host-project/.dockerignore:ro
    - ./scripts:/host-project/scripts:ro
    - ./DAILY.md:/host-project/DAILY.md:ro
    - ./STANDARDIZATION-SPEC.md:/host-project/STANDARDIZATION-SPEC.md:ro
    networks:
    - vulnuslab
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 768m
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)" || exit
        1
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 120s
  postgres:
    image: postgres:16
    container_name: vulnuslab_postgres
    environment:
    - POSTGRES_USER=vluser
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vlpass}
    - POSTGRES_DB=vulnuslab
    volumes:
    - pg_data:/var/lib/postgresql/data
    networks:
    - vulnuslab
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vluser -d vulnuslab"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vulnuslab_frontend
    ports:
    - 80:80
    - 443:443
    depends_on:
      backend:
        condition: service_healthy
    networks:
    - vulnuslab
    restart: unless-stopped
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./extra_nginx_conf:/etc/nginx/extra_nginx_conf:ro
  lab_dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    networks:
    - vulnuslab
    restart: unless-stopped
  lab_juiceshop:
    image: bkimminich/juice-shop
    container_name: lab_juiceshop
    networks:
    - vulnuslab
    restart: unless-stopped
  lab_bwapp:
    image: raesene/bwapp
    container_name: lab_bwapp
    networks:
    - vulnuslab
    restart: unless-stopped
  lab_mutillidae:
    image: citizenstig/nowasp
    container_name: lab_mutillidae
    networks:
    - vulnuslab
    restart: unless-stopped
  lab_webgoat:
    image: webgoat/webgoat
    container_name: lab_webgoat
    # The image's built-in healthcheck calls curl, which the image does not
    # ship, so the container always reports unhealthy. Probe with bash's
    # /dev/tcp instead and require a 200 from the actuator endpoint.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /WebGoat/actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
    - vulnuslab
    restart: unless-stopped
  lab_metasploitable:
    image: tleemcjr/metasploitable2
    container_name: lab_metasploitable
    # The image CMD ends in `bash`, which exits immediately without a TTY,
    # killing the container (restart loop, DNS name never stays registered).
    # tty + stdin_open keep PID1 alive so the vulnerable services stay up.
    tty: true
    stdin_open: true
    networks:
    - vulnuslab
    restart: unless-stopped
  # ── VL-METHOD Password Range ─────────────────────────────────────────
  # Three deterministic targets that exercise all 7 stages of every
  # Password Attacks scanner. All use admin/admin so quick_probe HITS
  # (which gates deep_scan + verify + privilege + chain_handoff).
  # See labs/vl_password_range/README.md for per-scanner invocations.
  # ─────────────────────────────────────────────────────────────────────
  lab_pwd_ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: lab_pwd_ssh
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PASSWORD_ACCESS=true
    - USER_NAME=admin
    - USER_PASSWORD=admin
    - SUDO_ACCESS=true
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_pwd_smb:
    image: dperson/samba:latest
    container_name: lab_pwd_smb
    command: >-
      -u "admin;admin"
      -s "public;/share;yes;no;yes;all"
      -p
    networks:
    - vulnuslab
    restart: unless-stopped

  lab_pwd_web:
    build:
      context: ./labs/vl_password_range/webform
      dockerfile: Dockerfile
    container_name: lab_pwd_web
    networks:
    - vulnuslab
    restart: unless-stopped

  # Optional RDP target — uncomment to enable Ncrack full-stage testing.
  # Image is ~600MB so it's off by default. Default creds: admin/admin.
  # lab_pwd_rdp:
  #   image: danielguerra/ubuntu-xrdp:latest
  #   container_name: lab_pwd_rdp
  #   environment:
  #   - TZ=Etc/UTC
  #   networks:
  #   - vulnuslab
  #   restart: unless-stopped

  # ── Phase C / D / E Password Attacks Labs (OPT-IN) ───────────────────
  # These three lab targets exercise the Active Directory (Phase C) and
  # OAuth/SAML (Phase D) Password Attacks scanners. They are commented
  # out by default because together they pull ~2.5 GB of images and
  # lab_pwd_ad needs ~90s to provision its Samba AD domain.
  #
  # To enable all three:
  #   1. Uncomment the three service blocks below.
  #   2. Run on the VPS:
  #        docker compose up -d lab_pwd_ad lab_pwd_oauth lab_pwd_saml
  #   3. For lab_pwd_ad, seed the test users once the DC is up:
  #        docker compose exec lab_pwd_ad bash /bootstrap.sh
  #
  # See labs/vl_password_range/PHASE_CDE_LABS.md for per-scanner
  # invocation walkthroughs and expected chain_handoff cascades.
  # ─────────────────────────────────────────────────────────────────────

  # lab_pwd_ad — Samba Active Directory Domain Controller
  # Targets: kerberoast_audit, asreproast_audit, dcsync_audit,
  #          bloodhound_audit, ldap_brute (against AD)
  # Image ~1.5GB, boot ~90s. Hostname dc01.vlrange.local is resolvable
  # inside the vulnuslab bridge.
  # lab_pwd_ad:
  #   image: nowsci/samba-domain:latest
  #   container_name: lab_pwd_ad
  #   hostname: dc01.vlrange.local
  #   environment:
  #   - DOMAIN=VLRANGE
  #   - DOMAIN_DC=dc=vlrange,dc=local
  #   - DOMAIN_EMAIL=vlrange.local
  #   - DOMAINPASS=VLrange_Admin_2026!
  #   - DNSFORWARDER=1.1.1.1
  #   - HOSTIP=
  #   - INSECURELDAP=true
  #   - NOCOMPLEXITY=true
  #   networks:
  #   - vulnuslab
  #   extra_hosts:
  #   - "dc01.vlrange.local:127.0.0.1"
  #   volumes:
  #   - lab_pwd_ad_data:/var/lib/samba
  #   - lab_pwd_ad_conf:/etc/samba/external
  #   - ./labs/vl_password_range/ad_bootstrap.sh:/bootstrap.sh:ro
  #   cap_add:
  #   - SYS_ADMIN
  #   restart: unless-stopped
  #   # Seeded users (run /bootstrap.sh once after first boot):
  #   #   Administrator / VLrange_Admin_2026!   (Domain Admin)
  #   #   svc_mssql     / Password123           (kerberoastable - MSSQLSvc SPN)
  #   #   svc_http      / Spring2024            (kerberoastable - HTTP SPN)
  #   #   jbloggs       / NoPreAuth!            (AS-REP roastable)
  #   #   regularuser   / regularuser           (standard domain user)

  # lab_pwd_oauth — Keycloak OAuth/OIDC IdP
  # Targets: oauth_token_audit
  # Image ~600MB. Realm vl-test-realm is auto-imported on first boot.
  # lab_pwd_oauth:
  #   image: quay.io/keycloak/keycloak:24.0.5
  #   container_name: lab_pwd_oauth
  #   command: ["start-dev", "--import-realm"]
  #   environment:
  #   - KEYCLOAK_ADMIN=admin
  #   - KEYCLOAK_ADMIN_PASSWORD=admin_VLrange_2026
  #   - KC_HTTP_ENABLED=true
  #   - KC_HOSTNAME_STRICT=false
  #   - KC_HOSTNAME_STRICT_HTTPS=false
  #   networks:
  #   - vulnuslab
  #   volumes:
  #   - ./labs/vl_password_range/keycloak:/opt/keycloak/data/import:ro
  #   restart: unless-stopped
  #   # Test users (in vl-test-realm):
  #   #   alice / Password1!
  #   #   bob   / Password2!
  #   # Client: vl-test-client (public, implicit flow ON, PKCE NOT enforced)

  # lab_pwd_saml — SimpleSAMLphp IdP + SP for SAML attack testing
  # Targets: saml_signature_audit
  # Image ~400MB. Provides both IdP and SP endpoints on port 8080.
  # lab_pwd_saml:
  #   image: kristophjunge/test-saml-idp:latest
  #   container_name: lab_pwd_saml
  #   environment:
  #   - SIMPLESAMLPHP_SP_ENTITY_ID=lab-saml-sp
  #   - SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE=http://lab_pwd_saml:8080/simplesaml/module.php/saml/sp/saml2-acs.php/default-sp
  #   - SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE=http://lab_pwd_saml:8080/simplesaml/module.php/saml/sp/saml2-logout.php/default-sp
  #   - SIMPLESAMLPHP_IDP_ENTITY_ID=http://lab_pwd_saml:8080/simplesaml/saml2/idp/metadata.php
  #   networks:
  #   - vulnuslab
  #   restart: unless-stopped
  #   # Test users (image defaults):
  #   #   user1 / user1pass
  #   #   user2 / user2pass

volumes:
  scan_data: null
  pg_data: null
  lab_pwd_ad_data: null
  lab_pwd_ad_conf: null
networks:
  vulnuslab:
    driver: bridge
