# OSCP Dashboard — Full Stack
# Customer runs: docker compose up -d
# Then open: http://localhost

services:

  # ── Backend: Kali Linux + all scanning tools + FastAPI ─────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oscp_backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true          # needed for nmap, tcpdump, masscan raw sockets
    ports:
      - "8000:8000"
      # Reverse-shell handler ports — bound to c2.vulnuslab.com (DNS-only A record,
      # NOT Cloudflare proxied) so external targets can connect back to msfconsole
      # listeners running inside this container.
      - "4444-4500:4444-4500/tcp"
    env_file:
      - .env                  # optional: SHODAN_KEY, VIRUSTOTAL_KEY, etc.
    volumes:
      - scan_data:/app/data   # persist scan results + user DB
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - oscp_net

  # ── Frontend: React dashboard served by nginx ──────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: oscp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - oscp_net

  # ── Vulnerable Lab Targets (built-in, no external VM needed) ───
  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    ports:
      - "8001:80"
    restart: unless-stopped
    networks:
      - oscp_net

  webgoat:
    image: webgoat/webgoat:latest
    container_name: lab_webgoat
    ports:
      - "8002:8080"
    restart: unless-stopped
    networks:
      - oscp_net

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: lab_juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - oscp_net

  mutillidae:
    image: citizenstig/nowasp
    container_name: lab_mutillidae
    ports:
      - "8003:80"
    restart: unless-stopped
    networks:
      - oscp_net

  bwapp:
    image: raesene/bwapp
    container_name: lab_bwapp
    ports:
      - "8004:80"
    restart: unless-stopped
    networks:
      - oscp_net

  # vsftpd 2.3.4 with the famous ":)" smile-username backdoor (CVE-2011-2523).
  # When a user logs in with a username containing ":)" the daemon opens a
  # secondary listener on port 6200 with a passwordless root shell. This is
  # the canonical "instant shell" demo for active exploitation — fast, reliable,
  # and visibly impressive to first-time users of the platform.
  vsftpd234:
    image: tleemcjr/vsftpd_2.3.4
    container_name: lab_vsftpd
    ports:
      - "8021:21"        # FTP control port exposed externally for testing
      - "8021:21/udp"
      - "6200:6200"      # Backdoor shell port — what Metasploit connects to
    restart: unless-stopped
    networks:
      - oscp_net

networks:
  oscp_net:
    driver: bridge

volumes:
  scan_data:
