<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer shield -->
  <path d="M100 10 L180 40 L180 110 C180 155 145 182 100 192 C55 182 20 155 20 110 L20 40 Z"
    fill="url(#grad1)" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner shield ring -->
  <path d="M100 24 L166 50 L166 110 C166 148 136 172 100 180 C64 172 34 148 34 110 L34 50 Z"
    fill="none" stroke="rgba(147,197,253,0.25)" stroke-width="2"/>

  <!-- Circuit lines -->
  <line x1="52" y1="80" x2="68" y2="80" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <line x1="132" y1="80" x2="148" y2="80" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <line x1="52" y1="130" x2="68" y2="130" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <line x1="132" y1="130" x2="148" y2="130" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="52" cy="80" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="148" cy="80" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="52" cy="130" r="3" fill="#6366f1" opacity="0.7"/>
  <circle cx="148" cy="130" r="3" fill="#6366f1" opacity="0.7"/>

  <!-- Lock body -->
  <rect x="72" y="98" width="56" height="46" rx="6" fill="none" stroke="url(#grad2)" stroke-width="4"/>
  <rect x="76" y="102" width="48" height="38" rx="4" fill="rgba(30,58,138,0.4)"/>

  <!-- Lock shackle -->
  <path d="M82 98 L82 82 C82 66 118 66 118 82 L118 98"
    stroke="#93c5fd" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Keyhole -->
  <circle cx="100" cy="119" r="7" fill="#93c5fd"/>
  <rect x="97" y="124" width="6" height="10" rx="2" fill="#93c5fd"/>

  <!-- Glow dot top -->
  <circle cx="100" cy="10" r="4" fill="#60a5fa" opacity="0.8"/>
</svg>
