<svg width="200" height="220" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield shape only - no background rectangle -->
  <path d="M100 8 L185 42 L185 115 C185 162 148 188 100 210 C52 188 15 162 15 115 L15 42 Z"
    fill="url(#g1)" filter="url(#glow)"/>

  <!-- Inner shield highlight -->
  <path d="M100 22 L171 52 L171 115 C171 155 138 178 100 197 C62 178 29 155 29 115 L29 52 Z"
    fill="none" stroke="rgba(147,197,253,0.3)" stroke-width="2"/>

  <!-- Lock body -->
  <rect x="70" y="108" width="60" height="50" rx="8"
    fill="none" stroke="url(#g2)" stroke-width="4"/>
  <rect x="74" y="112" width="52" height="42" rx="6"
    fill="rgba(37,99,235,0.35)"/>

  <!-- Lock shackle -->
  <path d="M80 108 L80 90 C80 72 120 72 120 90 L120 108"
    stroke="#93c5fd" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Keyhole circle -->
  <circle cx="100" cy="130" r="8" fill="#bfdbfe"/>
  <!-- Keyhole bottom -->
  <rect x="96.5" y="136" width="7" height="12" rx="3" fill="#bfdbfe"/>
</svg>
