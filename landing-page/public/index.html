<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta name="theme-color" content="#020617" />
    <meta name="description" content="51 real Kali Linux security tools in one cloud dashboard. XSS, SQLi, Nmap, Nikto and more. No installation needed." />
    <title>VulnusLab — Professional Penetration Testing Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', sans-serif; background: #020617; color: #f1f5f9; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
      @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
      @keyframes spin { to { transform:rotate(360deg); } }
      .fade-in { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
      .fade-in.visible { opacity: 1; transform: translateY(0); }

      /* Mobile responsive overrides for inline section paddings and wide grids */
      @media (max-width: 768px) {
        section { padding-left: 16px !important; padding-right: 16px !important; padding-top: 56px !important; padding-bottom: 56px !important; }
        footer { padding-left: 16px !important; padding-right: 16px !important; padding-top: 40px !important; padding-bottom: 24px !important; }
        h1 { font-size: clamp(28px, 8vw, 44px) !important; line-height: 1.15 !important; }
        h2 { font-size: clamp(22px, 6vw, 32px) !important; }
        h3 { font-size: clamp(18px, 5vw, 24px) !important; }
        body { font-size: 15px; }
        img, video { max-width: 100%; height: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection at build time. Real submissions come from the React form. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="plan" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
