<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — VulnusLab</title>
<style>
  :root{--bg:#0a0e17;--card:#0f1525;--border:#1c2435;--text:#c3ccda;--muted:#8a94a8;--white:#fff;--blue:#3b9eff;--green:#10b981;--red:#ff6b85}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:520px;margin:0 auto;padding:48px 22px 80px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand img{width:38px;height:38px}.brand span{font-size:18px;font-weight:900}.brand .v{color:#fff}.brand .l{color:var(--blue)}
  .tag{font-size:12px;color:var(--muted);margin:0 0 26px 48px}
  h1{color:#fff;font-size:24px;margin:8px 0 18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px}
  .plan{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
  .plan .name{font-size:16px;font-weight:700;color:#fff}.plan .price{font-size:22px;font-weight:800;color:var(--blue)}
  label{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=email]{width:100%;background:#0b1120;border:1px solid var(--border);border-radius:9px;color:#fff;font-size:15px;padding:11px 13px}
  input:focus{outline:none;border-color:var(--blue)}
  .auth{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:13px;color:var(--muted)}
  .auth input{margin-top:3px}
  button{width:100%;margin-top:8px;background:linear-gradient(135deg,#1d4ed8,#3b9eff);color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:800;padding:13px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:16px;font-size:14px;border-radius:9px;padding:12px 14px;display:none}
  .msg.err{display:block;background:rgba(224,35,71,.1);border:1px solid rgba(224,35,71,.4);color:var(--red)}
  .msg.ok{display:block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.4);color:var(--green)}
  .links{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
  .links a{color:var(--muted);text-decoration:none;margin:0 8px}
  .fine{font-size:11px;color:#475569;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/logo.svg" alt="VulnusLab" /><span><span class="v">VULNUS</span><span class="l">LAB</span></span></div>
  <p class="tag">Automated Vulnerability Assessment Platform</p>
  <h1>Checkout</h1>

  <div class="card" id="card">
    <div class="plan"><span class="name" id="planName">Loading plan…</span><span class="price" id="planPrice"></span></div>
    <label for="name">Full name</label>
    <input type="text" id="name" placeholder="Jane Doe" autocomplete="name" />
    <label for="email">Email (your login + receipt)</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email" />
    <div class="auth">
      <input type="checkbox" id="auth" />
      <label for="auth" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)">I confirm I will only use VulnusLab to scan systems I own or am explicitly authorized to test, and I agree to the <a href="/terms.html" style="color:var(--blue)">Terms</a> and <a href="/refund.html" style="color:var(--blue)">Refund Policy</a>.</label>
    </div>
    <button id="pay" disabled>Pay</button>
    <div class="msg" id="msg"></div>
    <div class="fine">Payments are processed securely by Razorpay. We never see your card details.</div>
  </div>

  <div class="links">
    <a href="/">Home</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/refund.html">Refund</a><a href="/contact.html">Contact</a>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  // Backend API base (dashboard host). Override with ?api= for testing.
  var API = new URLSearchParams(location.search).get("api") || "https://app.vulnuslab.com";
  var PLAN_ID = new URLSearchParams(location.search).get("plan") || "pro_monthly";
  var CFG = null, PLAN = null;
  var $ = function (id) { return document.getElementById(id); };
  function money(paise, cur) { var s = (cur || "INR") === "INR" ? "₹" : (cur + " "); return s + (paise / 100).toLocaleString(undefined, { minimumFractionDigits: 2 }); }
  function show(kind, text) { var m = $("msg"); m.className = "msg " + kind; m.textContent = text; }

  fetch(API + "/api/payment/config")
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      CFG = cfg;
      PLAN = (cfg.plans || []).filter(function (p) { return p.id === PLAN_ID; })[0] || (cfg.plans || [])[0];
      if (!PLAN) { $("planName").textContent = "No plans available"; return; }
      $("planName").textContent = PLAN.label;
      $("planPrice").textContent = money(PLAN.amount, PLAN.currency);
      if (!cfg.configured) { show("err", "Payments are not live yet — please check back soon or email support@vulnuslab.com."); return; }
      refreshBtn();
    })
    .catch(function () { show("err", "Could not load checkout. Please try again later."); });

  function valid() {
    var email = $("email").value.trim();
    return PLAN && CFG && CFG.configured && $("name").value.trim().length >= 2 &&
           email.indexOf("@") > 0 && email.indexOf(".") > email.indexOf("@") && $("auth").checked;
  }
  function refreshBtn() {
    $("pay").disabled = !valid();
    $("pay").textContent = PLAN ? ("Pay " + money(PLAN.amount, PLAN.currency)) : "Pay";
  }
  ["name", "email", "auth"].forEach(function (id) { $(id).addEventListener("input", refreshBtn); $(id).addEventListener("change", refreshBtn); });

  $("pay").addEventListener("click", function () {
    if (!valid()) return;
    $("pay").disabled = true; show("ok", "Creating your secure order…");
    fetch(API + "/api/payment/create-order", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan_id: PLAN.id, name: $("name").value.trim(), email: $("email").value.trim() })
    })
      .then(function (r) { if (!r.ok) throw new Error("order"); return r.json(); })
      .then(function (o) {
        var rzp = new Razorpay({
          key: o.key_id, order_id: o.order_id, amount: o.amount, currency: o.currency,
          name: "VulnusLab", description: o.plan_label,
          prefill: { name: o.name, email: o.email }, theme: { color: "#2563eb" },
          handler: function (resp) {
            show("ok", "Verifying payment…");
            fetch(API + "/api/payment/verify", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                razorpay_order_id: resp.razorpay_order_id,
                razorpay_payment_id: resp.razorpay_payment_id,
                razorpay_signature: resp.razorpay_signature
              })
            }).then(function (r) { return r.json(); }).then(function (v) {
              if (v.verified) {
                $("card").innerHTML = "<h2 style='color:#10b981;margin-top:0'>Payment successful</h2>" +
                  "<p>Your <b>" + o.plan_label + "</b> plan is active. We've emailed your login details and receipt to <b>" +
                  o.email + "</b>. If you don't see it within a few minutes, check spam or email support@vulnuslab.com.</p>" +
                  "<p style='margin-top:18px'><a href='https://app.vulnuslab.com' style='background:#2563eb;color:#fff;text-decoration:none;padding:11px 22px;border-radius:9px;font-weight:700;display:inline-block'>Go to dashboard</a></p>";
              } else { show("err", "We received your payment but couldn't verify it automatically. Email support@vulnuslab.com with your payment ID."); }
            }).catch(function () { show("err", "Payment received — verification pending. You'll get an email shortly."); });
          },
          modal: { ondismiss: function () { $("pay").disabled = false; show("err", "Payment cancelled."); } }
        });
        rzp.on("payment.failed", function () { $("pay").disabled = false; show("err", "Payment failed. Please try again."); });
        rzp.open();
      })
      .catch(function () { $("pay").disabled = false; show("err", "Could not start payment. Please try again or email support@vulnuslab.com."); });
  });
</script>
</body>
</html>
