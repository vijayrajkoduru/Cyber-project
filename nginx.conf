server {
    listen 80;
    server_name app.vulnuslab.com 187.127.162.231;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self';" always;

    # Hashed static assets (e.g. main.a1b2c3.js, main.a1b2c3.css) are content-addressed —
    # safe to cache aggressively. CRA emits a new hash per build so this never serves stale code.
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html and the manifest must NEVER be cached — they point to the latest hashed assets.
    # If this is cached, new deploys are invisible until the user manually clears cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }
    location = /asset-manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }


    # ── SECURITY: Block all dot-prefixed paths (.env, .git, .htaccess, etc.)
    # Without this, any file accidentally COPYed into the docroot can be
    # downloaded by anyone — see the May 2026 .env leak incident.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # React app — all routes fall through to index.html (SPA routing)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # API calls — proxy to FastAPI, never cache
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
}
