server {
    # NGINX-DNS-RESOLVE-V1 — re-resolve "backend" per request so docker IP
    # changes after restart don\'t strand nginx on a dead upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    server_tokens off;     # hide nginx version (was leaked in 502 error pages)
    listen 80;
    server_name app.vulnuslab.com 187.127.162.231;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self';" always;

    # Hashed static assets (e.g. main.a1b2c3.js, main.a1b2c3.css) are content-addressed —
    # safe to cache aggressively. CRA emits a new hash per build so this never serves stale code.
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html and the manifest must NEVER be cached — they point to the latest hashed assets.
    # If this is cached, new deploys are invisible until the user manually clears cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }
    location = /asset-manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }


    # ── SECURITY: Block dot-prefixed paths + common attacker probe targets.
    # Defense added after May 2026 .env leak. Hardened May 2026 #2.
    location ~ /\.                                    { deny all; access_log off; log_not_found off; return 404; }
    location ~ \.(env|git|svn|hg|bak|backup|old|swp|swo|orig|inc|conf|config|ini|sql|sqlite|db|pem|key|crt|p12|pfx|asc)$ {
        deny all; access_log off; log_not_found off; return 404;
    }
    location ~ ^/(docker-compose|Dockerfile|package-lock|composer|yarn\.lock|requirements|Procfile|README|TODO|CHANGELOG)(\.|$) {
        deny all; access_log off; log_not_found off; return 404;
    }
    location ~ ^/(wp-admin|wp-login|wp-config|administrator|phpmyadmin|phpinfo|server-status|server-info|console|debug|trace) {
        access_log off; log_not_found off; return 404;
    }
    location ~ \.(php|phtml|php3|php4|php5|php7|phps|asp|aspx|jsp|jspx|cgi|pl|py|sh|bash)$ {
        # This is a Node/Python app — no PHP/JSP scripts should ever be served.
        deny all; access_log off; return 404;
    }


    # React app — all routes fall through to index.html (SPA routing)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # Tight rate-limit on login attempts (defined in extra_nginx_conf/limit.conf)
    location = /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        set $login_upstream "http://backend:8000/api/auth/login";
        proxy_pass $login_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # General API calls — broader rate limit, proxy to FastAPI
    # NGINX-HEALTH-EXACT-V1 — exact match so health checks bypass any rate limit / rewrites
    location = /api/health {
        set $health_upstream "http://backend:8000/api/health";
        proxy_pass $health_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }


    # Streaming endpoint — must NOT buffer. Each NDJSON line needs to reach
    # the browser as soon as the backend yields it, otherwise nginx holds the
    # whole response and the streaming benefit (sub-100s Cloudflare TTFB) is
    # lost. This must come BEFORE the generic /api/ block.
    location = /api/recon/run_all {
        limit_req zone=scan_limit burst=10 nodelay;
        limit_req_status 429;
        set $stream_upstream "http://backend:8000/api/recon/run_all";
        proxy_pass $stream_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The five lines that matter for streaming:
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        chunked_transfer_encoding on;
        proxy_read_timeout       600s;   # 10 min — full scan even on slow targets
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-store, no-transform" always;
    }

    # Same streaming behaviour for /api/scan/run_all — Webapp module's v2
    # orchestrator. Identical config because the same Cloudflare/proxy
    # constraints apply.
    location = /api/scan/run_all {
        limit_req zone=scan_limit burst=10 nodelay;
        limit_req_status 429;
        set $webapp_stream_upstream "http://backend:8000/api/scan/run_all";
        proxy_pass $webapp_stream_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        chunked_transfer_encoding on;
        proxy_read_timeout       600s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-store, no-transform" always;
    }

    # Vuln module's v2 orchestrator — same streaming treatment.
    location = /api/vuln/run_all {
        limit_req zone=scan_limit burst=10 nodelay;
        limit_req_status 429;
        set $vuln_stream_upstream "http://backend:8000/api/vuln/run_all";
        proxy_pass $vuln_stream_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        chunked_transfer_encoding on;
        proxy_read_timeout       600s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control     "no-store, no-transform" always;
    }

    location /api/ {
        limit_req zone=scan_limit burst=10 nodelay;
        limit_req_status 429;
        set $api_upstream "http://backend:8000$request_uri";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
}
