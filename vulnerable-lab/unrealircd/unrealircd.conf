/* UnrealIRCd 3.2.8.1 minimal config */
me {
    name "irc.vulnlab.local";
    info "Vulnerable IRC Server";
    numeric 1;
};
admin {
    "VulnLab Admin";
    "admin";
    "admin@vulnlab.local";
};
listen {
    ip *;
    port 6667;
};
allow {
    ip *@*;
    class clients;
    maxperip 100;
};
class clients {
    pingfreq 90;
    maxclients 500;
    sendq 100000;
    recvq 8000;
};
log "ircd.log" { flags all; };
