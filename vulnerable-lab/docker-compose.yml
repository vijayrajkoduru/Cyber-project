# ══════════════════════════════════════════════════════════════════
#  OSCP VULNERABLE LAB — Docker Compose
#  13 targets: 5 Web Apps + 8 Exploit Services
#  Network: 172.20.0.0/24
#
#  USAGE (run on Kali):
#    cd ~/vulnerable-lab
#    docker-compose up -d            # start all
#    docker-compose up -d dvwa       # start one
#    docker-compose down             # stop all
#    docker-compose ps               # check status
# ══════════════════════════════════════════════════════════════════

version: "3.8"

networks:
  vulnlab:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

services:

  # ── WEB APP TARGETS ──────────────────────────────────────────
  # 172.20.0.10 — DVWA
  dvwa:
    image: vulnerables/web-dvwa
    container_name: vuln-dvwa
    restart: unless-stopped
    ports:
      - "10080:80"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.10
    environment:
      - MYSQL_PASS=p@ssw0rd

  # 172.20.0.11 — WebGoat
  webgoat:
    image: webgoat/webgoat
    container_name: vuln-webgoat
    restart: unless-stopped
    ports:
      - "18080:8080"
      - "19090:9090"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.11
    environment:
      - WEBGOAT_PORT=8080

  # 172.20.0.12 — OWASP Juice Shop
  juiceshop:
    image: bkimminich/juice-shop
    container_name: vuln-juiceshop
    restart: unless-stopped
    ports:
      - "13000:3000"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.12

  # 172.20.0.13 — Mutillidae II
  mutillidae:
    image: webpwnized/mutillidae
    container_name: vuln-mutillidae
    restart: unless-stopped
    ports:
      - "10081:80"
      - "10443:443"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.13

  # 172.20.0.14 — bWAPP
  bwapp:
    build: ./bwapp
    container_name: vuln-bwapp
    restart: unless-stopped
    ports:
      - "10082:80"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.14

  # ── EXPLOIT SERVICE TARGETS ───────────────────────────────────
  # 172.20.0.20 — vsftpd 2.3.4 (CVE-2011-2523) Backdoor
  vsftpd:
    build: ./vsftpd
    container_name: vuln-vsftpd
    restart: unless-stopped
    ports:
      - "10021:21"
      - "16200:6200"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.20
    cap_add:
      - NET_ADMIN

  # 172.20.0.21 — SambaCry (CVE-2017-7494) — Linux Samba RCE
  sambacry:
    build: ./sambacry
    container_name: vuln-sambacry
    restart: unless-stopped
    ports:
      - "10139:139"
      - "10445:445"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.21
    cap_add:
      - NET_ADMIN

  # 172.20.0.22 — Apache Struts2 (CVE-2017-5638) S2-045
  struts2:
    build: ./struts2
    container_name: vuln-struts2
    restart: unless-stopped
    ports:
      - "18888:8080"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.22

  # 172.20.0.23 — Shellshock (CVE-2014-6271) Apache+bash
  shellshock:
    build: ./shellshock
    container_name: vuln-shellshock
    restart: unless-stopped
    ports:
      - "10083:80"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.23

  # 172.20.0.24 — Heartbleed (CVE-2014-0160) OpenSSL 1.0.1
  heartbleed:
    build: ./heartbleed
    container_name: vuln-heartbleed
    restart: unless-stopped
    ports:
      - "10443:443"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.24

  # 172.20.0.25 — Log4Shell (CVE-2021-44228) Log4j RCE
  log4shell:
    build: ./log4shell
    container_name: vuln-log4shell
    restart: unless-stopped
    ports:
      - "18983:8983"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.25

  # 172.20.0.26 — UnrealIRCd 3.2.8.1 (CVE-2010-2075) Backdoor
  unrealircd:
    build: ./unrealircd
    container_name: vuln-unrealircd
    restart: unless-stopped
    ports:
      - "16667:6667"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.26

  # 172.20.0.27 — ProFTPd 1.3.3c (CVE-2010-4221) Backdoor
  proftpd:
    build: ./proftpd
    container_name: vuln-proftpd
    restart: unless-stopped
    ports:
      - "10022:21"
    networks:
      vulnlab:
        ipv4_address: 172.20.0.27
