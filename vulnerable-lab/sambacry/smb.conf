[global]
   workgroup = WORKGROUP
   server string = Samba Server %v
   netbios name = vulnlab-samba
   security = user
   map to guest = bad user
   dns proxy = no
   # Vulnerable setting — allows pipe loading
   nt pipe support = yes

[data]
   path = /data/share
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   directory mask = 0777
   force user = root
