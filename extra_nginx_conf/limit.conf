# Rate limiting — added after May 2026 .env-scan-then-register attack.
# Applied to /api/auth/login via `limit_req` in default.conf.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Bumped from 30r/m to 5r/s (300r/m). Dashboard loads ~12 API calls on init
# (admin/vault, backups, scans, tiles), and a v2 recon run still counts as ONE
# request — so 30r/m starved the dashboard before the user even clicked Scan.
# 5r/s + burst=10 still rejects automated abuse (>120r/min) but allows normal UI.
limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=5r/s;

# RATE-SPLIT-V1 (2026-11-12): the dashboard fires ~45 GETs on load (module tier
# listings, plan/trial status, profiles...). With every /api/ call sharing
# scan_limit (5r/s, burst 10) nginx 429'd the trial/plan status calls, so the
# Upgrade-to-Pro banner never rendered. Reads (GET/HEAD) now get their own,
# roomier bucket; everything else (scans, writes) keeps the strict one. An empty
# key means "not counted" in that zone.
map $request_method $vl_read_key  { GET $binary_remote_addr; HEAD $binary_remote_addr; default ""; }
map $request_method $vl_write_key { GET ""; HEAD ""; default $binary_remote_addr; }
limit_req_zone $vl_read_key  zone=read_limit:10m  rate=20r/s;
limit_req_zone $vl_write_key zone=write_limit:10m rate=5r/s;
